  <!-- TV Mode (= the crew-board rotation) and the scale-to-fit board, before render -->
  <script>
    (function() {
      var q = new URLSearchParams(window.location.search);
      var stored = false;
      try { stored = localStorage.getItem('tvMode') === 'true'; } catch (e) { /* storage blocked */ }
      if (q.get('tv') === '1' || stored) document.documentElement.classList.add('tv-mode');
      function fit() {
        var w = window.innerWidth, h = window.innerHeight, on = w > 1024;
        var z = on ? Math.min(w / 1920, h / 1080) : 1;
        document.documentElement.classList.toggle('fit', on);
        document.documentElement.style.setProperty('--tv-zoom', String(Math.round(z * 1000) / 1000));
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>

<body class="idle cells-board">
  <a href="index.html" class="ro-home-btn cl-home" title="Operations Hub"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
  <div class="noise-overlay" aria-hidden="true"></div>

  <header class="hud-header">
    <div class="strain-display">
      <div class="strain-label" id="cellsCount">—</div>
      <div class="strain-name" id="cellsCultivars">—</div>
    </div>
    <div class="hud-center-marker">
      <div class="status-badge"><span id="statusText">—</span><span id="staleDot" class="cl-stale" title="Data is more than 3 minutes old" hidden></span></div>
    </div>
    <div class="time-display">
      <div class="time" id="clock">--:--</div>
      <div class="date" id="date">—</div>
    </div>
  </header>

  <div id="main-panel" class="cockpit">
    <div class="center-stage">
      <div class="hero-spotlight" aria-hidden="true"></div>
      <div class="hero-status-float"><div class="daily-delta neutral" id="heroDelta">—</div></div>
      <div class="hero-daily"><div class="daily-actual" id="heroLb">—</div></div>
      <div class="hero-sub">
        <div class="hero-goal">
          <span class="daily-sep">/</span>
          <span class="daily-target" id="heroGoal">—</span>
          <span class="daily-unit" id="heroGoalUnit">lbs goal so far</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar"><div class="progress-fill" id="heroFill" style="width:0%"></div></div>
          <span class="progress-hours" id="heroHours"></span>
        </div>
      </div>
      <div class="daily-projection" id="eodCard" hidden>
        <span class="projection-label" id="eodLabel">End of day:</span>
        <span class="projection-value" id="eodValue">—</span>
        <span class="projection-goal" id="eodGoal"></span>
        <span class="projection-delta neutral" id="eodDelta"></span>
      </div>
    </div>

    <!-- LEFT: one card per cell in use. Red is only an andon (someone is needed). -->
    <section class="cells-panel" aria-label="Cells">
      <div class="panel-k"><span id="cellsTitle" data-i18n="clTitle">Cells</span> <small id="cellsKey">lb today · rounds</small></div>
      <div class="cell-grid" id="cellGrid"></div>
    </section>

    <!-- RIGHT: what needs a hand -->
    <section class="side-panel" aria-label="Pickups and quality">
      <div class="card pick-card">
        <div class="pick"><b id="pickCount" class="zero">0</b><div><span id="pickTitle">No baskets waiting</span><small id="pickList"></small></div></div>
      </div>
      <div class="card qual-card" id="qualCard">
        <div class="k" id="qualTitle">Quality today</div>
        <div class="qual-row">
          <div><b id="qualPass">0</b><span id="qualPassK">pass</span></div>
          <div class="redo"><b id="qualRedo">0</b><span id="qualRedoK">redo</span></div>
        </div>
        <div class="qual-stop" id="qualStop" hidden></div>
      </div>
      <div class="goal-note" id="goalNote"></div>
    </section>

    <div class="bottom-strip">
      <div class="chart-container" style="display:flex; flex-direction:column;">
        <div class="chart-header" id="chartTitle">Cells · lb per cell-hour</div>
        <div class="cell-chart" id="cellChart"></div>
      </div>

      <section class="leaders-panel" id="leadersPanel" aria-labelledby="leadersTitle" hidden>
        <div class="leaders-head">
          <span class="leaders-title" id="leadersTitle">Top 5</span>
          <span class="leaders-day" id="leadersDay"></span>
          <span class="leaders-goal" id="leadersGoal" hidden></span>
        </div>
        <ol class="leaders-list" id="leadersList"></ol>
      </section>

      <div class="rounds-panel">
        <div class="cycle-history-title" id="roundsTitle">Rounds today</div>
        <div class="rounds-stats">
          <div><b id="roundsN">0</b><span id="roundsK">Rounds</span></div>
          <div><b id="pickupsN">0</b><span id="pickupsK">Pickups waiting</span></div>
          <div><b id="cellHrsN">0</b><span id="cellHrsK">Cell-hours</span></div>
        </div>
      </div>
    </div>
  </div>

  <button id="langBtn" class="cl-lang" type="button" aria-label="Idioma / Language"><b>ES</b> · EN</button>

  <!-- TV rotation: the crew board shows here for 30 s every 10 min (TV Mode only) -->
  <div id="leadersOverlay" class="leaders-overlay" aria-hidden="true"></div>
</body>
