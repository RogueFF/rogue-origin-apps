<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Planner | Rogue Origin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared-base.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: var(--space-sm); }
    header { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; justify-content: space-between; margin-bottom: var(--space-sm); }
    h1 { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: 1.6rem; }
    h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; margin: 0 0 4px; }
    h3 { font-family: var(--font-ui); font-weight: 600; font-size: 1rem; margin: 0; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-sm); margin-bottom: var(--space-sm); box-shadow: var(--shadow-sm); }
    .step-head { display: flex; align-items: baseline; gap: var(--space-xs); flex-wrap: wrap; justify-content: space-between; margin-bottom: 6px; }
    .row { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
    .btn { min-height: 44px; min-width: 44px; padding: 0 var(--space-sm); border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--bg-warm); color: var(--text); font: inherit; cursor: pointer; }
    .btn.primary { background: var(--ro-green); color: #fff; border-color: var(--ro-green); }
    .btn.danger { color: var(--danger); }
    input, select { min-height: 44px; padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--bg-card); color: var(--text); font: inherit; box-sizing: border-box; max-width: 100%; }
    input.num { width: 90px; font-family: var(--font-mono); }
    input.unit { width: 90px; }
    input.name { min-width: 170px; }
    input.impl { width: 130px; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-light); white-space: nowrap; }
    th { color: var(--text-secondary); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
    td.mono, td.num { font-family: var(--font-mono); }
    td.num { text-align: right; }
    .muted { color: var(--text-muted); font-size: 0.85rem; }
    .stage-group { border-left: 4px solid var(--ro-green); padding: 6px 12px; margin-bottom: 8px; background: var(--bg-warm); border-radius: var(--radius-sm); }
    .stage-group.bottleneck { border-left-color: var(--ro-gold); }
    .chart-wrap { overflow-x: auto; }
    svg text { fill: var(--text-secondary); font-family: var(--font-mono); font-size: 11px; }
    svg .label { fill: var(--text); font-family: var(--font-ui); font-size: 12px; }
    .summary { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-xs); }
    .stat { background: var(--bg-warm); border-radius: var(--radius-sm); padding: 8px 12px; min-width: 150px; }
    .stat b { display: block; font-family: var(--font-mono); font-size: 1.15rem; }
    .warn { color: var(--danger); font-size: 0.85rem; min-height: 1em; }
    .tag { font-size: 0.75rem; padding: 2px 6px; border-radius: 999px; background: var(--gold-dim); color: var(--gold-text); }
    .tag.over { background: var(--danger-dim); color: var(--danger); }
    .tag.machine { background: var(--info); color: #fff; }
    @media (max-width: 768px) { h1 { font-size: 1.3rem; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="row">
        <a href="index.html" class="btn" title="Operations Hub">&#8962;</a>
        <h1 id="title">Flow Planner</h1>
      </div>
      <div class="row">
        <select id="lang" aria-label="Language">
          <option value="en">English</option>
          <option value="es">Español</option>
        </select>
        <select id="templateSelect" aria-label="Template"></select>
        <button class="btn" id="loadTemplate">Load</button>
        <button class="btn" id="exportBtn">Export</button>
        <label class="btn" style="display:inline-flex;align-items:center">Import
          <input type="file" id="importFile" accept="application/json" hidden>
        </label>
      </div>
    </header>

    <section class="card">
      <div class="row">
        <label class="muted" for="projectName">Project</label>
        <input id="projectName" class="name" type="text">
        <label class="muted" for="unitLabel">Batch unit</label>
        <input id="unitLabel" type="text" style="width:120px">
      </div>
    </section>

    <!-- 1. List the steps -->
    <section class="card">
      <div class="step-head">
        <h2 id="h1"></h2>
        <button class="btn primary" id="addStep">+</button>
      </div>
      <p class="muted" id="help1"></p>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>#</th><th id="th1a"></th><th id="th1b"></th><th id="th1c"></th>
            <th id="th1d"></th><th id="th1e"></th><th id="th1f"></th><th></th>
          </tr></thead>
          <tbody id="listRows"></tbody>
        </table>
      </div>
    </section>

    <!-- 2. What can run together -->
    <section class="card">
      <h2 id="h2"></h2>
      <p class="muted" id="help2"></p>
      <div id="stageGroups"></div>
    </section>

    <!-- 3. Measure -->
    <section class="card">
      <h2 id="h3"></h2>
      <p class="muted" id="help3"></p>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>#</th><th id="th3a"></th><th id="th3b"></th><th id="th3c"></th><th id="th3d"></th><th id="th3e"></th><th id="th3f"></th>
          </tr></thead>
          <tbody id="measureRows"></tbody>
        </table>
      </div>
      <p class="muted" id="measureNote"></p>
    </section>

    <!-- 4. Chart and flow -->
    <section class="card">
      <h2 id="h4"></h2>
      <p class="muted" id="help4"></p>
      <div class="row" style="margin-bottom:var(--space-xs)">
        <label class="muted" for="batch" id="lbBatch"></label>
        <input id="batch" class="num" type="number" min="0.1" step="any">
        <label class="muted" for="target" id="lbTarget"></label>
        <input id="target" class="num" type="number" min="0.1" step="any">
      </div>
      <div class="chart-wrap"><svg id="chart" role="img"></svg></div>
      <div class="table-scroll" style="margin-top:var(--space-xs)">
        <table>
          <thead><tr>
            <th id="th4a"></th><th id="th4b"></th><th class="num" id="th4c"></th>
            <th class="num" id="th4d"></th><th class="num" id="th4e"></th><th class="num" id="th4f"></th><th id="th4g"></th>
          </tr></thead>
          <tbody id="flowRows"></tbody>
        </table>
      </div>
      <div class="summary" id="summary"></div>
      <p class="warn" id="errors" role="alert"></p>
    </section>
  </div>

<script>
  // ---------- Strings ----------
  const LABELS = {
    en: {
      title: 'Flow Planner', load: 'Load', export: 'Export', import: 'Import',
      projectName: 'Project', batchUnit: 'Batch unit', stepN: 'Step', stage: 'Stage', type: 'Type',
      unitCol: 'Unit', perBatch: 'Per batch unit', implement: 'Implement',
      typePeople: 'People', typeMachine: 'Machine',
      h1: '1 · List the steps',
      help1: 'Write every step in the order the work moves. Same stage number = runs at the same time. Per batch unit = how many of this step\'s unit make one batch (for example, 40 rows per acre).',
      h2: '2 · What runs together', help2: 'Steps in the same stage run at the same time on the same batch. A stage takes as long as its slowest step.',
      h3: '3 · Measure each step',
      help3: 'People steps: count units, minutes, and people. Machine steps: measure the speed in mph, the working width of the implement in feet, field efficiency, and how many people run each machine.',
      measureNote: 'Measure the full step, not one unit. Use at least three runs and average them. Field efficiency is the share of the time actually working the ground (turns, fills, and stops take the rest). 75% is a common starting point.',
      units: 'Units', mins: 'Minutes', people: 'People', mph: 'mph', width: 'Width (ft)', operators: 'Operators per machine',
      eff: 'Efficiency %', result: 'Result', ppm: 'person-min/unit', aph: 'acres/hr',
      h4: '4 · Cycle time chart',
      help4: 'Pick a batch size in the batch unit and the pace you want (minutes per batch). Crew sizes fill in so every step fits the pace.',
      batch: 'Batch size', target: 'Target min per batch',
      minPerBatch: 'Min per batch', crew: 'Crew (people or machines)', need: 'Needed', idle: 'Idle', status: 'Status',
      stageLabel: 'Stage', stageCol: 'Stage', noSteps: 'Add a step to begin.', bottleneck: 'Bottleneck',
      lineCycle: 'Line cycle', leadTime: 'Lead time per batch', rate: 'Output per hour', maxBatch: 'Largest batch the current crew can flow at target',
      crewTotal: 'Total people', machines: 'machines',
      over: 'Over target', ok: 'Fits target', targetShort: 'target',
      errMeasure: 'Each people step needs units, minutes and people above 0. Each machine step needs mph, width and efficiency above 0.',
      errStage: 'Stage must be a whole number, 1 or more.', errBatch: 'Batch size and target must be above 0.',
      errPerBatch: 'Per batch unit must be above 0.',
      min: 'min', perHour: '/h', unitDefault: 'units', machineStep: 'machine', badFile: 'Could not read that file.', stepFallback: 'Step'
    },
    es: {
      title: 'Planificador de flujo', load: 'Cargar', export: 'Exportar', import: 'Importar',
      projectName: 'Proyecto', batchUnit: 'Unidad de lote', stepN: 'Paso', stage: 'Etapa', type: 'Tipo',
      unitCol: 'Unidad', perBatch: 'Por unidad de lote', implement: 'Implemento',
      typePeople: 'Personas', typeMachine: 'Máquina',
      h1: '1 · Lista los pasos',
      help1: 'Escribe cada paso en el orden en que se mueve el trabajo. Mismo número de etapa = se hace al mismo tiempo. Por unidad de lote = cuántas de las unidades de este paso forman un lote (por ejemplo, 40 surcos por acre).',
      h2: '2 · Qué se hace junto', help2: 'Los pasos de la misma etapa se hacen al mismo tiempo en el mismo lote. Una etapa tarda lo que tarda su paso más lento.',
      h3: '3 · Mide cada paso',
      help3: 'Pasos de personas: cuenta unidades, minutos y personas. Pasos de máquina: mide la velocidad en mph, el ancho de trabajo del implemento en pies, la eficiencia en campo y cuántas personas operan cada máquina.',
      measureNote: 'Mide el paso completo, no una sola unidad. Usa al menos tres corridas y saca el promedio. La eficiencia en campo es la parte del tiempo que realmente se trabaja la tierra (vueltas, llenados y paradas ocupan el resto). 75% es un punto de partida común.',
      units: 'Unidades', mins: 'Minutos', people: 'Personas', mph: 'mph', width: 'Ancho (pies)', operators: 'Operadores por máquina',
      eff: 'Eficiencia %', result: 'Resultado', ppm: 'persona-min/unidad', aph: 'acres/h',
      h4: '4 · Gráfica de tiempos de ciclo',
      help4: 'Elige el tamaño de lote en la unidad de lote y el ritmo que quieres (minutos por lote). Las cuadrillas se calculan para que cada paso quepa en ese ritmo.',
      batch: 'Tamaño de lote', target: 'Minutos meta por lote',
      minPerBatch: 'Min por lote', crew: 'Cuadrilla (personas o máquinas)', need: 'Necesarias', idle: 'Ocio', status: 'Estado',
      stageLabel: 'Etapa', stageCol: 'Etapa', noSteps: 'Agrega un paso para empezar.', bottleneck: 'Cuello de botella',
      lineCycle: 'Ciclo de la línea', leadTime: 'Tiempo total por lote', rate: 'Producción por hora', maxBatch: 'Lote más grande que la cuadrilla actual puede fluir a la meta',
      crewTotal: 'Personas en total', machines: 'máquinas',
      over: 'Arriba de la meta', ok: 'Cumple la meta', targetShort: 'meta',
      errMeasure: 'Cada paso de personas necesita unidades, minutos y personas mayores que 0. Cada paso de máquina necesita mph, ancho y eficiencia mayores que 0.',
      errStage: 'La etapa debe ser un número entero, 1 o más.', errBatch: 'El lote y la meta deben ser mayores que 0.',
      errPerBatch: 'Por unidad de lote debe ser mayor que 0.',
      min: 'min', perHour: '/h', unitDefault: 'unidades', machineStep: 'máquina', badFile: 'No se pudo leer ese archivo.', stepFallback: 'Paso'
    }
  };

  // Placeholder numbers. Replace with what the crew actually measures.
  const TEMPLATES = {
    fallPrep: {
      name: 'Fall field prep (placeholder numbers)',
      unit: 'acre',
      batch: 2,
      target: 120,
      steps: [
        { name: 'Chop plants', type: 'people', stage: 1, unit: 'rows', perBatch: 40, obsUnits: 10, obsMin: 30, obsPeople: 2 },
        { name: 'Pull drip tape', type: 'people', stage: 2, unit: 'rows', perBatch: 40, obsUnits: 10, obsMin: 40, obsPeople: 2 },
        { name: 'Plow soil', type: 'machine', stage: 3, unit: 'acres', perBatch: 1, implement: 'Chisel plow', mph: 4, widthFt: 8, effPct: 75, operators: 1, crew: 0 }
      ]
    },
    packing: {
      name: 'Packing line example (placeholder numbers)',
      unit: 'bags',
      batch: 50,
      target: 20,
      steps: [
        { name: 'Fill bags', type: 'people', stage: 1, unit: 'bags', perBatch: 1, obsUnits: 50, obsMin: 25, obsPeople: 2 },
        { name: 'Seal bags', type: 'people', stage: 2, unit: 'bags', perBatch: 1, obsUnits: 50, obsMin: 15, obsPeople: 1 },
        { name: 'Label bags', type: 'people', stage: 2, unit: 'bags', perBatch: 1, obsUnits: 50, obsMin: 12, obsPeople: 1 },
        { name: 'Stack on pallet', type: 'people', stage: 3, unit: 'bags', perBatch: 1, obsUnits: 50, obsMin: 20, obsPeople: 1 }
      ]
    },
    blank: { name: 'Blank', unit: 'units', batch: 10, target: 30, steps: [] }
  };

  let lang = localStorage.getItem('fp-lang') || 'en';
  let project = { name: '', unit: 'units', batch: 10, target: 30, steps: [] };
  const t = key => LABELS[lang][key] || key;

  // ---------- Model ----------
  // Every step reduces to one number: k = minutes of work for one batch unit by one crew member
  // (one person, or one machine). Then:
  //   minutes per batch = batch × k ÷ crew
  //   crew needed       = batch × k ÷ target
  //   largest batch     = target × crew ÷ k
  function isMachine(s) {
    return s.type === 'machine';
  }
  // Acres per hour for one machine: mph × width ÷ 8.25 × efficiency.
  // (5,280 ft × width ft ÷ 43,560 sq ft per acre = width ÷ 8.25 acres per mile.)
  function acresPerHour(s) {
    return s.mph > 0 && s.widthFt > 0 && s.effPct > 0 ? (s.mph * s.widthFt / 8.25) * (s.effPct / 100) : 0;
  }
  function personMinPerUnit(s) {
    return s.obsUnits > 0 && s.obsMin > 0 && s.obsPeople > 0 ? (s.obsMin * s.obsPeople) / s.obsUnits : 0;
  }
  function kOf(s) {
    if (isMachine(s)) {
      const aph = acresPerHour(s);
      return aph > 0 && s.perBatch > 0 ? (s.perBatch / aph) * 60 : 0;
    }
    return s.perBatch > 0 ? s.perBatch * personMinPerUnit(s) : 0;
  }
  // People per crew member: a machine needs its operators.
  function peoplePerCrew(s) {
    return isMachine(s) ? Math.max(1, s.operators || 1) : 1;
  }
  function neededCrew(s, batch, target) {
    const k = kOf(s);
    if (!k || !(target > 0)) return 0;
    return Math.max(1, Math.ceil((batch * k) / target));
  }
  function crewOf(s, batch, target) {
    return s.crew > 0 ? s.crew : neededCrew(s, batch, target);
  }
  function minutesPerBatch(s, batch, crew) {
    const k = kOf(s);
    return crew > 0 && k ? (batch * k) / crew : 0;
  }

  function analyze(batch, target) {
    const rows = project.steps.map((s, i) => {
      const crew = crewOf(s, batch, target);
      return {
        i, s, crew,
        people: crew * peoplePerCrew(s),
        need: neededCrew(s, batch, target),
        k: kOf(s),
        minutes: minutesPerBatch(s, batch, crew)
      };
    });
    const stages = {};
    rows.forEach(r => {
      const key = Number(r.s.stage) || 1;
      stages[key] = Math.max(stages[key] || 0, r.minutes);
    });
    const stageKeys = Object.keys(stages).map(Number).sort((a, b) => a - b);
    const lineCycle = stageKeys.length ? Math.max(...stageKeys.map(k => stages[k])) : 0;
    const leadTime = stageKeys.reduce((acc, k) => acc + stages[k], 0);
    const bottleneckStage = stageKeys.find(k => stages[k] === lineCycle);
    let maxBatch = 0;
    if (rows.length && rows.every(r => r.k > 0 && r.crew > 0) && target > 0) {
      maxBatch = Math.floor(Math.min(...rows.map(r => (target * r.crew) / r.k)));
    }
    return { rows, stages, stageKeys, lineCycle, leadTime, bottleneckStage, maxBatch };
  }

  // ---------- Helpers ----------
  function fmtNum(n, d = 1) {
    return Number.isFinite(n) ? (Math.round(n * 10 ** d) / 10 ** d).toString() : '–';
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function stepName(i) {
    return project.steps[i].name || `${t('stepFallback')} ${i + 1}`;
  }
  function stepUnit(s) {
    return isMachine(s) ? (s.unit || 'acres') : (s.unit || project.unit);
  }
  function validate() {
    const msgs = [];
    project.steps.forEach((s, i) => {
      const ok = isMachine(s)
        ? s.mph > 0 && s.widthFt > 0 && s.effPct > 0 && s.effPct <= 100
        : s.obsUnits > 0 && s.obsMin > 0 && s.obsPeople > 0;
      if (!ok) msgs.push(`${stepName(i)}: ${t('errMeasure')}`);
      if (!(s.perBatch > 0)) msgs.push(`${stepName(i)}: ${t('errPerBatch')}`);
      if (!(Number.isInteger(Number(s.stage)) && Number(s.stage) >= 1)) msgs.push(`${stepName(i)}: ${t('errStage')}`);
    });
    if (!(project.batch > 0 && project.target > 0)) msgs.push(t('errBatch'));
    return [...new Set(msgs)];
  }

  // ---------- Step 1: list ----------
  function renderList() {
    document.getElementById('listRows').innerHTML = project.steps.map((s, i) => `
      <tr>
        <td class="mono">${i + 1}</td>
        <td><input class="name" data-i="${i}" data-f="name" value="${esc(s.name)}"></td>
        <td><input class="num" type="number" min="1" step="1" data-i="${i}" data-f="stage" value="${s.stage}" aria-label="${t('stage')}"></td>
        <td>
          <select data-i="${i}" data-f="type" aria-label="${t('type')}">
            <option value="people" ${isMachine(s) ? '' : 'selected'}>${t('typePeople')}</option>
            <option value="machine" ${isMachine(s) ? 'selected' : ''}>${t('typeMachine')}</option>
          </select>
        </td>
        <td><input class="unit" data-i="${i}" data-f="unit" value="${esc(s.unit)}" placeholder="${isMachine(s) ? 'acres' : esc(project.unit)}"></td>
        <td><input class="num" type="number" min="0" step="any" data-i="${i}" data-f="perBatch" value="${s.perBatch}" aria-label="${t('perBatch')}"></td>
        <td>${isMachine(s) ? `<input class="impl" data-i="${i}" data-f="implement" value="${esc(s.implement || '')}" aria-label="${t('implement')}">` : ''}</td>
        <td><button class="btn danger" data-remove="${i}" aria-label="remove">×</button></td>
      </tr>`).join('');
    // Column headers depend on the language only; set them here so they stay in sync.
    const l = LABELS[lang];
    document.getElementById('th1a').textContent = l.stepN;
    document.getElementById('th1b').textContent = l.stage;
    document.getElementById('th1c').textContent = l.type;
    document.getElementById('th1d').textContent = l.unitCol;
    document.getElementById('th1e').textContent = l.perBatch;
    document.getElementById('th1f').textContent = l.implement;
  }

  // ---------- Step 2: grouping ----------
  function renderGroups(plan) {
    const wrap = document.getElementById('stageGroups');
    if (!project.steps.length) { wrap.innerHTML = `<p class="muted">${t('noSteps')}</p>`; return; }
    wrap.innerHTML = plan.stageKeys.map(k => {
      const names = project.steps
        .map((s, i) => ({ s, i }))
        .filter(x => (Number(x.s.stage) || 1) === k)
        .map(x => `${esc(stepName(x.i))}${isMachine(x.s) ? ` <span class="tag machine">${esc(x.s.implement || t('machineStep'))}</span>` : ''}`);
      const isBottleneck = k === plan.bottleneckStage;
      return `
        <div class="stage-group ${isBottleneck ? 'bottleneck' : ''}">
          <strong>${t('stageLabel')} ${k}</strong>
          ${isBottleneck ? `<span class="tag">${t('bottleneck')}</span>` : ''}
          <div>${names.join(' + ')}</div>
        </div>`;
    }).join('');
  }

  // ---------- Step 3: measure ----------
  function renderMeasure() {
    document.getElementById('measureRows').innerHTML = project.steps.map((s, i) => {
      if (isMachine(s)) {
        return `
          <tr>
            <td class="mono">${i + 1}</td>
            <td>${esc(stepName(i))} <span class="tag machine">${esc(s.implement || t('machineStep'))}</span></td>
            <td><input class="num" type="number" min="0" step="0.1" data-i="${i}" data-f="mph" value="${s.mph || ''}" aria-label="${t('mph')}"></td>
            <td><input class="num" type="number" min="0" step="0.5" data-i="${i}" data-f="widthFt" value="${s.widthFt || ''}" aria-label="${t('width')}"></td>
            <td><input class="num" type="number" min="1" step="1" data-i="${i}" data-f="operators" value="${s.operators || ''}" aria-label="${t('operators')}"></td>
            <td><input class="num" type="number" min="1" max="100" step="1" data-i="${i}" data-f="effPct" value="${s.effPct || ''}" aria-label="${t('eff')}"></td>
            <td class="num mono" data-result="${i}"></td>
          </tr>`;
      }
      return `
        <tr>
          <td class="mono">${i + 1}</td>
          <td>${esc(stepName(i))}</td>
          <td><input class="num" type="number" min="0" step="any" data-i="${i}" data-f="obsUnits" value="${s.obsUnits}" aria-label="${t('units')}"></td>
          <td><input class="num" type="number" min="0" step="any" data-i="${i}" data-f="obsMin" value="${s.obsMin}" aria-label="${t('mins')}"></td>
          <td><input class="num" type="number" min="0" step="1" data-i="${i}" data-f="obsPeople" value="${s.obsPeople}" aria-label="${t('people')}"></td>
          <td class="muted">–</td>
          <td class="num mono" data-result="${i}"></td>
        </tr>`;
    }).join('');
    const l = LABELS[lang];
    document.getElementById('th3a').textContent = l.stepN;
    document.getElementById('th3b').textContent = `${l.units} / ${l.mph}`;
    document.getElementById('th3c').textContent = `${l.mins} / ${l.width}`;
    document.getElementById('th3d').textContent = `${l.people} / ${l.operators}`;
    document.getElementById('th3e').textContent = l.eff;
    document.getElementById('th3f').textContent = l.result;
    updateResults();
  }
  function updateResults() {
    project.steps.forEach((s, i) => {
      const cell = document.querySelector(`[data-result="${i}"]`);
      if (!cell) return;
      cell.textContent = isMachine(s)
        ? `${fmtNum(acresPerHour(s), 2)} ${t('aph')}`
        : `${fmtNum(personMinPerUnit(s), 2)} ${t('ppm')}`;
    });
  }

  // ---------- Step 4: chart and flow ----------
  function renderChart(plan) {
    const svg = document.getElementById('chart');
    if (!plan.rows.length) { svg.innerHTML = ''; svg.setAttribute('width', 0); svg.setAttribute('height', 0); return; }
    const labelW = 230, rowH = 34, pad = 28, plotW = 600;
    const C = project.target;
    const maxT = Math.max(C, ...plan.rows.map(r => r.minutes), 1) * 1.1;
    const x = m => labelW + (m / maxT) * plotW;
    const H = plan.rows.length * rowH + pad * 2;
    const W = labelW + plotW + 90;
    const step = maxT > 200 ? 30 : 10;

    let out = '';
    for (let m = 0; m <= maxT; m += step) {
      out += `<line x1="${x(m)}" y1="${pad - 6}" x2="${x(m)}" y2="${H - pad + 6}" stroke="var(--border-light)"/>`;
      out += `<text x="${x(m)}" y="${pad - 10}" text-anchor="middle">${m}</text>`;
    }
    plan.rows.forEach((r, row) => {
      const y = pad + row * rowH;
      const isBottleneck = Number(r.s.stage) === plan.bottleneckStage;
      const fill = r.minutes > C * 1.001 ? 'var(--danger)' : (isBottleneck ? 'var(--ro-gold)' : 'var(--ro-green)');
      const who = isMachine(r.s) ? `${r.crew} ${t('machines')}` : `${r.crew}p`;
      out += `<text x="8" y="${y + 21}" class="label">${esc(stepName(r.i))} · ${t('stageLabel')} ${r.s.stage}</text>`;
      out += `<rect x="${labelW}" y="${y + 6}" width="${Math.max(2, x(r.minutes) - labelW)}" height="${rowH - 12}" rx="4" fill="${fill}" opacity="0.9"/>`;
      out += `<text x="${x(r.minutes) + 6}" y="${y + 21}">${fmtNum(r.minutes)} ${t('min')} · ${who}</text>`;
    });
    out += `<line x1="${x(C)}" y1="${pad - 6}" x2="${x(C)}" y2="${H - pad + 6}" stroke="var(--info)" stroke-width="2" stroke-dasharray="5 3"/>`;
    out += `<text x="${x(C)}" y="${H - 6}" text-anchor="middle" style="fill:var(--info)">${t('targetShort')} ${fmtNum(C)}</text>`;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.innerHTML = out;
  }

  function renderFlow(plan) {
    const C = project.target;
    document.getElementById('flowRows').innerHTML = plan.rows.map(r => {
      const idle = plan.lineCycle > 0 ? 1 - r.minutes / plan.lineCycle : 0;
      const over = r.minutes > C * 1.001;
      const label = isMachine(r.s) ? t('typeMachine') : t('typePeople');
      return `
        <tr>
          <td>${esc(stepName(r.i))}</td>
          <td>${t('stageLabel')} ${r.s.stage} · ${label}</td>
          <td class="num mono">${fmtNum(r.minutes)}</td>
          <td class="num mono"><input class="num" type="number" min="0" step="1" data-crew="${r.i}" value="${r.s.crew || ''}" placeholder="${r.need}" aria-label="${t('crew')}"></td>
          <td class="num mono">${r.need}</td>
          <td class="num mono">${fmtNum(idle * 100, 0)}%</td>
          <td><span class="tag ${over ? 'over' : ''}">${over ? t('over') : t('ok')}</span></td>
        </tr>`;
    }).join('');
    const people = plan.rows.reduce((a, r) => a + r.people, 0);
    const machines = plan.rows.filter(r => isMachine(r.s)).reduce((a, r) => a + r.crew, 0);
    document.getElementById('summary').innerHTML = plan.rows.length ? `
      <div class="stat"><span class="muted">${t('lineCycle')}</span><b>${fmtNum(plan.lineCycle)} ${t('min')}</b></div>
      <div class="stat"><span class="muted">${t('rate')}</span><b>${fmtNum(plan.lineCycle > 0 ? project.batch * 60 / plan.lineCycle : 0)} ${esc(project.unit)}${t('perHour')}</b></div>
      <div class="stat"><span class="muted">${t('leadTime')}</span><b>${fmtNum(plan.leadTime)} ${t('min')}</b></div>
      <div class="stat"><span class="muted">${t('crewTotal')}</span><b>${people}${machines ? ` + ${machines} ${t('machines')}` : ''}</b></div>
      <div class="stat"><span class="muted">${t('maxBatch')}</span><b>${plan.maxBatch || '–'} ${esc(project.unit)}</b></div>` : '';
  }

  // Rebuilds everything, including the input rows. Used on structural changes.
  function renderAll() {
    renderList();
    renderMeasure();
    updateDerived();
  }
  // Refreshes the outputs only, so the input being typed in keeps focus.
  function updateDerived() {
    document.getElementById('errors').textContent = validate().join(' · ');
    const plan = analyze(project.batch, project.target);
    renderGroups(plan);
    updateResults();
    renderChart(plan);
    renderFlow(plan);
    document.getElementById('title').textContent = project.name || t('title');
  }

  // ---------- Persistence ----------
  function saveLocal() {
    try { localStorage.setItem('fp-project', JSON.stringify(project)); } catch (_) { /* private mode */ }
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem('fp-project');
      return raw ? JSON.parse(raw) : null;
    } catch (_) { return null; }
  }
  function normalize(p) {
    const num = v => Number(v) || 0;
    return {
      name: String(p.name || ''),
      unit: String(p.unit || t('unitDefault')),
      batch: num(p.batch) || 10,
      target: num(p.target) || 30,
      steps: (p.steps || []).map(s => ({
        name: String(s.name || ''),
        type: s.type === 'machine' ? 'machine' : 'people',
        stage: Math.max(1, Math.floor(num(s.stage) || 1)),
        unit: String(s.unit || ''),
        perBatch: num(s.perBatch) || 1,
        crew: Math.max(0, Math.floor(num(s.crew))),
        obsUnits: num(s.obsUnits),
        obsMin: num(s.obsMin),
        obsPeople: num(s.obsPeople),
        implement: String(s.implement || ''),
        mph: num(s.mph),
        widthFt: num(s.widthFt),
        effPct: num(s.effPct),
        operators: Math.max(0, Math.floor(num(s.operators)))
      }))
    };
  }

  // ---------- Labels and events ----------
  function applyLabels() {
    const l = LABELS[lang];
    document.getElementById('lang').value = lang;
    document.documentElement.lang = lang;
    document.getElementById('projectName').previousElementSibling.textContent = l.projectName;
    document.getElementById('unitLabel').previousElementSibling.textContent = l.batchUnit;
    document.getElementById('loadTemplate').textContent = l.load;
    document.getElementById('exportBtn').textContent = l.export;
    document.getElementById('h1').textContent = l.h1;
    document.getElementById('help1').textContent = l.help1;
    document.getElementById('h2').textContent = l.h2;
    document.getElementById('help2').textContent = l.help2;
    document.getElementById('h3').textContent = l.h3;
    document.getElementById('help3').textContent = l.help3;
    document.getElementById('measureNote').textContent = l.measureNote;
    document.getElementById('h4').textContent = l.h4;
    document.getElementById('help4').textContent = l.help4;
    document.getElementById('lbBatch').textContent = l.batch;
    document.getElementById('lbTarget').textContent = l.target;
    document.getElementById('th4a').textContent = l.stepN;
    document.getElementById('th4b').textContent = l.stageCol;
    document.getElementById('th4c').textContent = l.minPerBatch;
    document.getElementById('th4d').textContent = l.crew;
    document.getElementById('th4e').textContent = l.need;
    document.getElementById('th4f').textContent = l.idle;
    document.getElementById('th4g').textContent = l.status;
  }

  function fillTemplateSelect() {
    document.getElementById('templateSelect').innerHTML =
      Object.entries(TEMPLATES).map(([k, v]) => `<option value="${k}">${esc(v.name)}</option>`).join('');
  }

  function refresh() {
    document.getElementById('projectName').value = project.name;
    document.getElementById('unitLabel').value = project.unit;
    document.getElementById('batch').value = project.batch;
    document.getElementById('target').value = project.target;
    renderAll();
    saveLocal();
  }
  // Called on every keystroke: updates outputs and saves, without rebuilding inputs.
  function touch() {
    updateDerived();
    saveLocal();
  }

  function bind() {
    document.getElementById('lang').addEventListener('change', e => {
      lang = e.target.value;
      try { localStorage.setItem('fp-lang', lang); } catch (_) {}
      applyLabels();
      fillTemplateSelect();
      refresh();
    });

    document.getElementById('loadTemplate').addEventListener('click', () => {
      project = normalize(TEMPLATES[document.getElementById('templateSelect').value]);
      refresh();
    });

    document.getElementById('addStep').addEventListener('click', () => {
      const next = project.steps.length ? Math.max(...project.steps.map(s => Number(s.stage) || 1)) + 1 : 1;
      project.steps.push(normalize({ steps: [{ stage: next }] }).steps[0]);
      refresh();
    });

    // Typing updates outputs only. Changing type or removing a step rebuilds the rows.
    document.getElementById('listRows').addEventListener('input', e => {
      const i = Number(e.target.dataset.i);
      const f = e.target.dataset.f;
      if (!f || f === 'type') return;
      const v = e.target.value;
      if (f === 'name' || f === 'unit' || f === 'implement') project.steps[i][f] = v;
      else if (f === 'stage') project.steps[i].stage = Math.max(1, Math.floor(Number(v) || 1));
      else if (f === 'perBatch') project.steps[i].perBatch = Number(v) || 0;
      touch();
    });
    document.getElementById('listRows').addEventListener('change', e => {
      if (e.target.dataset.f !== 'type') return;
      project.steps[Number(e.target.dataset.i)].type = e.target.value;
      refresh();
    });
    document.getElementById('listRows').addEventListener('click', e => {
      const btn = e.target.closest('[data-remove]');
      if (!btn) return;
      project.steps.splice(Number(btn.dataset.remove), 1);
      refresh();
    });

    document.getElementById('measureRows').addEventListener('input', e => {
      const i = Number(e.target.dataset.i);
      const f = e.target.dataset.f;
      if (!f) return;
      project.steps[i][f] = Number(e.target.value) || 0;
      touch();
    });

    // Crew is typed in step 4; change (on blur or Enter) avoids rebuilding the field mid-typing.
    document.getElementById('flowRows').addEventListener('change', e => {
      const i = Number(e.target.dataset.crew);
      if (Number.isNaN(i)) return;
      project.steps[i].crew = Math.max(0, Math.floor(Number(e.target.value) || 0));
      refresh();
    });

    document.getElementById('batch').addEventListener('input', e => { project.batch = Number(e.target.value) || 0; touch(); });
    document.getElementById('target').addEventListener('input', e => { project.target = Number(e.target.value) || 0; touch(); });
    document.getElementById('projectName').addEventListener('input', e => { project.name = e.target.value; touch(); });
    document.getElementById('unitLabel').addEventListener('input', e => { project.unit = e.target.value; touch(); });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(project.name || 'flow-plan').replace(/[^a-z0-9]+/gi, '-').toLowerCase()}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    document.getElementById('importFile').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        project = normalize(JSON.parse(await file.text()));
        refresh();
      } catch (_) {
        document.getElementById('errors').textContent = t('badFile');
      }
    });
  }

  // ---------- Init ----------
  (function init() {
    project = normalize(loadLocal() || TEMPLATES.fallPrep);
    fillTemplateSelect();
    applyLabels();
    bind();
    refresh();
  })();
</script>
</body>
</html>
