  <!-- ── ORDER EDITOR ────────────────────────────── -->
  <div id="modal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modal-title">New order</h2>
        <span class="spacer"></span>
        <button id="modal-close" class="icon-btn" aria-label="Close">
          <i class="ph-duotone ph-x"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="field-row">
          <div class="field">
            <label for="f-customer" data-i18n="customer">Customer</label>
            <select id="f-customer"></select>
          </div>
          <div class="field">
            <label for="f-status" data-i18n="status">Status</label>
            <select id="f-status"></select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="f-date" data-i18n="order_date">Order date</label>
            <input id="f-date" type="date">
          </div>
          <div class="field">
            <label for="f-terms" data-i18n="terms">Payment terms</label>
            <input id="f-terms" type="text" placeholder="DAP">
          </div>
        </div>

        <div class="lines-head">
          <h3 data-i18n="line_items">Line items</h3>
          <button id="btn-add-line" class="btn btn-secondary" data-i18n="add_line">Add line</button>
        </div>

        <div class="line-labels" aria-hidden="true">
          <span data-i18n="cultivar">Cultivar</span>
          <span data-i18n="form">Form</span>
          <span data-i18n="quantity">Quantity</span>
          <span data-i18n="unit">Unit</span>
          <span data-i18n="unit_price">Price/unit</span>
          <span></span>
        </div>
        <div id="line-rows" class="line-rows"></div>

        <div class="modal-total">
          <span class="lbs" id="total-lbs">0 lb</span>
          <span class="usd" id="total-usd">$0</span>
        </div>

        <div class="field">
          <label for="f-notes" data-i18n="notes">Notes</label>
          <textarea id="f-notes"></textarea>
        </div>

        <p id="form-error" class="form-error" role="alert"></p>
      </div>

      <div class="modal-foot">
        <button id="btn-delete" class="btn btn-danger" hidden data-i18n="delete">Delete</button>
        <span class="spacer"></span>
        <button id="btn-cancel" class="btn btn-secondary" data-i18n="cancel">Cancel</button>
        <button id="btn-save" class="btn btn-primary" data-i18n="save">Save</button>
      </div>
    </div>
  </div>

  <!-- ── CUSTOMER ────────────────────────────────── -->
  <div id="customer-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="c-title">
    <div class="modal" style="width:min(460px,100%)">
      <div class="modal-head">
        <h2 id="c-title" data-i18n="new_customer">New customer</h2>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="c-company" data-i18n="company">Company</label>
          <input id="c-company" type="text">
        </div>
        <div class="field">
          <label for="c-name" data-i18n="name">Contact name</label>
          <input id="c-name" type="text">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="c-city" data-i18n="city">City</label>
            <input id="c-city" type="text">
          </div>
          <div class="field">
            <label for="c-state" data-i18n="region">State / country</label>
            <input id="c-state" type="text">
          </div>
        </div>
        <p id="c-error" class="form-error" role="alert"></p>
      </div>
      <div class="modal-foot">
        <span class="spacer"></span>
        <button id="c-cancel" class="btn btn-secondary" data-i18n="cancel">Cancel</button>
        <button id="c-save" class="btn btn-primary" data-i18n="save">Save</button>
      </div>
    </div>
  </div>
