  <!-- Theme, applied before the first paint (mirrors theme.js resolution order). -->
  <script>
    try {
      var t = localStorage.getItem('ro-theme');
      if (t !== 'dark' && t !== 'light') {
        t = null;
        var legacy = ['theme', 'sopDarkMode', 'darkMode', 'kanbanDarkMode', 'barcodeDarkMode'];
        for (var i = 0; i < legacy.length; i++) {
          var v = localStorage.getItem(legacy[i]);
          if (v == null) continue;
          t = (v === 'dark' || v === 'true') ? 'dark' : 'light';
          break;
        }
      }
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* localStorage blocked: keep the markup default */ }
  </script>
