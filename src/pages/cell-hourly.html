<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cell Hourly Log - Rogue Origin</title>
  <meta name="theme-color" content="#2d3a2e">
  <link rel="icon" type="image/png" href="/rogue-origin-apps/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared-base.css?h=c18beb73">
  <link rel="stylesheet" href="../css/cell-hourly.css?h=d36dd670">
<!-- module-hashes:start -->
<!-- generated by stamp-modules — do not edit by hand -->
<script type="importmap">
{
  "imports": {
    "../js/cell-hourly/main.js": "../js/cell-hourly/main.js?h=f19efc94",
    "../js/hourly-entry/cultivar-options.mjs": "../js/hourly-entry/cultivar-options.mjs?h=262d9bda",
    "../js/shared/i18n.js": "../js/shared/i18n.js?h=6c5893f7"
  }
}
</script>
<!-- module-hashes:end -->
  <script type="module" src="../js/cell-hourly/main.js?h=f19efc94"></script>
</head>
<body>
  <header class="ch-head">
    <div>
      <h1 data-i18n="title">Cell hourly log</h1>
      <div id="dateText" class="muted"></div>
    </div>
    <button id="langToggle" class="btn ghost" aria-label="Language">ES</button>
  </header>

  <main class="ch-main">
    <nav id="hourBar" class="hour-bar" aria-label="Hours"></nav>

    <section class="card room">
      <div class="room-grid">
        <label class="field">
          <span class="eyebrow" data-i18n="roomCultivar">Cultivar this hour</span>
          <select id="roomCultivar"></select>
        </label>
        <label class="field">
          <span class="eyebrow" data-i18n="roomSmalls">Smalls, whole room (lb)</span>
          <input id="roomSmalls" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
        </label>
      </div>
      <div id="roomStatus" class="save-status"></div>
      <div class="bag">
        <div class="bag-text"><span data-i18n="wholesaleToday">Wholesale tops today</span>: <b id="wsTotal">0.00 lb</b> · <span data-i18n="bagsFull">5 kg bags</span>: <b id="wsBags">0</b></div>
        <div class="bar"><div id="wsBar" class="bar-fill"></div></div>
        <div id="wsNext" class="muted small"></div>
      </div>
    </section>

    <section class="card cell" aria-live="polite">
      <div class="cell-top">
        <button id="prevBtn" class="btn nav" aria-label="Previous cell">‹</button>
        <div class="cell-name">
          <div id="cellLabel" class="cell-title"></div>
          <div class="muted small"><span id="cellId"></span> · <span id="cellLane" class="lane"></span> <button id="editBtn" class="link" data-i18n="edit">Edit</button></div>
        </div>
        <button id="nextBtn" class="btn nav" aria-label="Next cell">›</button>
      </div>

      <div id="editBox" class="edit" hidden>
        <label class="field"><span class="eyebrow" data-i18n="nameLabel">Name or label</span><input id="editLabel" type="text" maxlength="40"></label>
        <div class="seg" role="group">
          <button id="laneWholesale" class="btn chip" data-i18n="wholesale">Wholesale</button>
          <button id="laneRetail" class="btn chip" data-i18n="retail">Retail</button>
        </div>
        <div class="row">
          <button id="editSave" class="btn primary" data-i18n="save">Save</button>
          <button id="editCancel" class="btn" data-i18n="cancel">Cancel</button>
          <button id="removeBtn" class="btn danger" data-i18n="removeCell">Remove cell</button>
        </div>
      </div>

      <label class="field">
        <span class="eyebrow" data-i18n="topsLabel">Tops this hour</span>
        <span class="tops-wrap"><input id="tops" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"><span class="unit">lb</span></span>
      </label>
      <div id="rate" class="muted"></div>

      <div class="eyebrow" data-i18n="quality">Quality</div>
      <div class="seg quality" role="group">
        <button id="qNone" class="btn" data-i18n="notChecked">Not checked</button>
        <button id="qPass" class="btn pass" data-i18n="pass">Pass</button>
        <button id="qFail" class="btn fail" data-i18n="fail">Fail</button>
      </div>
      <div id="failNeedsNote" class="error" hidden data-i18n="failNeedsNote">Write what failed in the notes first</div>

      <label class="field">
        <span class="eyebrow" data-i18n="notes">Notes</span>
        <textarea id="notes" rows="2" maxlength="500"></textarea>
      </label>

      <label class="field">
        <span class="eyebrow" data-i18n="cellCultivar">Cultivar at this cell</span>
        <select id="cellCultivar"></select>
      </label>

      <div id="cellStatus" class="save-status"></div>
    </section>

    <section class="card">
      <div class="grid-head">
        <span class="eyebrow" data-i18n="jump">All cells this hour</span>
        <span id="doneCount" class="muted small"></span>
      </div>
      <div id="jumpGrid" class="jump-grid"></div>
      <button id="addBtn" class="btn" data-i18n="addCell">+ Add cell</button>
    </section>
  </main>
</body>
</html>
