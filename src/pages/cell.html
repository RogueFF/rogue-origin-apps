<body>
  <header class="cell-head">
    <h1 id="cellName">Cell</h1>
    <div class="head-right">
      <span id="liveDot" class="live-dot stale" aria-live="polite"><span class="dot"></span><span id="liveText" data-i18n="waiting">Waiting for scale</span></span>
      <button id="langToggle" class="btn ghost" aria-label="Language">ES</button>
    </div>
  </header>

  <main class="cell-main">
    <section class="card core" aria-labelledby="workingLabel">
      <label id="workingLabel" class="eyebrow" for="workingInput" data-i18n="workingOn">Working on</label>
      <input id="workingInput" class="order-input" type="text" data-i18n-placeholder="workingPlaceholder" placeholder="Order · cultivar · weight" autocomplete="off">

      <div class="ring-row">
        <svg class="ring" viewBox="0 0 220 220" role="img" aria-labelledby="ringTitle">
          <title id="ringTitle">Progress toward the target</title>
          <circle class="ring-bg" cx="110" cy="110" r="95"></circle>
          <circle id="ringFill" class="ring-fill" cx="110" cy="110" r="95" stroke-dasharray="597" stroke-dashoffset="597" transform="rotate(-90 110 110)"></circle>
        </svg>
        <div class="ring-center">
          <div id="netValue" class="net">0.0 g</div>
          <div class="of"><span data-i18n="of">of</span> <span id="targetText">454 g</span></div>
        </div>
        <div class="ring-side">
          <div class="stat"><div class="stat-label" data-i18n="toGo">To go</div><div id="toGo" class="stat-value">—</div></div>
          <div class="stat"><div class="stat-label" data-i18n="done">Done</div><div id="pct" class="stat-value">0%</div></div>
          <button id="tareBtn" class="btn" data-i18n="tare">Tare</button>
        </div>
      </div>
    </section>

    <section class="tiles">
      <div class="card tile">
        <div class="eyebrow" data-i18n="target">Target</div>
        <div class="presets" id="presets"></div>
        <label class="custom"><span data-i18n="customG">Custom (g)</span>
          <input id="customTarget" type="number" min="1" step="0.1" inputmode="decimal">
        </label>
      </div>
      <div class="card tile">
        <div class="eyebrow" data-i18n="liveCycle">Live cycle time</div>
        <div id="cycleTime" class="big">--:--</div>
        <div id="cycleSub" class="sub" data-i18n="notStarted">Not started</div>
        <div class="row">
          <button id="startBtn" class="btn primary" data-i18n="start">Start</button>
          <button id="doneBtn" class="btn" data-i18n="finish">Done</button>
        </div>
      </div>
    </section>

    <section class="card next">
      <label class="eyebrow" for="nextInput" data-i18n="nextOrder">Next order</label>
      <input id="nextInput" class="order-input small" type="text" data-i18n-placeholder="nextPlaceholder" placeholder="Next order · cultivar · weight" autocomplete="off">
    </section>

    <p class="pilot-note" data-i18n="pilotNote">Pilot: orders are typed here until the order board is connected. The scale weight is live.</p>
  </main>
</body>
</html>
