<body>
  <header class="ro-head">
    <div>
      <h1 data-i18n="title">Raw hand-out</h1>
      <div id="sub" class="muted"></div>
    </div>
    <div class="head-right">
      <a id="boardLink" class="btn ghost" href="cells.html" data-i18n="board">Cells board</a>
      <button id="langToggle" class="btn ghost" aria-label="Language">ES</button>
    </div>
  </header>
  <main class="ro-main">
    <p id="notice" class="notice" hidden></p>

    <section class="card">
      <h2><span class="step">1</span> <span data-i18n="pickCell">Pick the cell</span></h2>
      <div id="cells" class="cells"></div>
    </section>

    <section id="panel" class="card panel" hidden>
      <h2 id="panelTitle"></h2>

      <!-- No raw at the cell: a new hand-out -->
      <div id="newLot" hidden>
        <div class="row">
          <label class="lbl"><span class="step">2</span> <span data-i18n="cultivar">Cultivar</span></label>
          <select id="cultivar" class="big-select"><option value="" data-i18n="chooseCultivar">Choose the cultivar</option></select>
          <p id="fromScreen" class="hint" hidden></p>
        </div>
        <div class="row">
          <label class="lbl"><span class="step">3</span> <span data-i18n="bagSize">Bag size</span></label>
          <div id="bagChips" class="chips"></div>
        </div>
        <div class="row">
          <label class="lbl" data-i18n="bags">How many bags</label>
          <div class="stepper">
            <button id="bagsMinus" class="btn step-btn" aria-label="-">−</button>
            <output id="bagsVal">1</output>
            <button id="bagsPlus" class="btn step-btn" aria-label="+">+</button>
          </div>
        </div>
        <div class="row">
          <label class="lbl"><span class="step">4</span> <span data-i18n="weighThis">Weigh this much raw</span></label>
          <div id="suggest" class="suggest">—</div>
          <p id="suggestWhy" class="hint"></p>
        </div>
      </div>

      <!-- Raw at the cell: top up or weigh back -->
      <div id="openLot" hidden>
        <div id="lotSummary" class="lot-summary"></div>
        <div class="tabs" role="tablist">
          <button id="tabMore" class="btn tab" role="tab" data-i18n="addMore">Add more raw</button>
          <button id="tabBack" class="btn tab" role="tab" data-i18n="weighBack">Weigh back</button>
        </div>
      </div>

      <div id="entry" class="row" hidden>
        <label class="lbl" for="grams"><span class="step" id="gramsStep">5</span> <span id="gramsLabel"></span></label>
        <div class="entry">
          <input id="grams" class="grams" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
          <span class="unit">g</span>
        </div>
        <button id="noneLeft" class="btn ghost" data-i18n="noneLeft" hidden>Nothing left: 0 g</button>
        <p id="warn" class="warn" hidden></p>
        <button id="save" class="btn primary"></button>
      </div>

      <div class="panel-foot">
        <button id="undo" class="btn ghost" data-i18n="undo">Undo the last entry</button>
        <span id="saved" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="today">Today</h2>
      <div class="table-wrap"><table id="lots" class="data"></table></div>
      <p id="lotsEmpty" class="muted" data-i18n="noLots">No raw handed out today yet.</p>
    </section>

    <section class="card">
      <h2 data-i18n="byCultivar">Yield by cultivar</h2>
      <p id="rollupSub" class="muted"></p>
      <div class="table-wrap"><table id="rollup" class="data"></table></div>
      <p id="rollupEmpty" class="muted" data-i18n="noRollup">No weighed lots yet: a lot counts once its raw is weighed back and the cell's tops are in.</p>
    </section>
  </main>
</body>
</html>
