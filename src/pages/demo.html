<body>
  <div class="demo-badge" data-t="badge">DEMO · a mock day, nothing live</div>
  <header class="wt-head">
    <div class="title">
      <h1 data-t="title">Floor walkthrough</h1>
      <div class="clockrow"><b id="clock" class="clock">--</b> <span id="tally" class="tally"></span></div>
    </div>
    <div class="controls">
      <button id="play" class="btn primary" type="button" data-t="pause">Pause</button>

      <label><span data-t="variation">Variation</span> <input id="seed" type="number" value="1" min="1" max="999"></label>
      <button id="newDay" class="btn" type="button" data-t="newDay">New day</button>
      <label class="file"><span data-t="csv">Replay a Shopify export (CSV)</span> <input id="csv" type="file" accept=".csv,text/csv"></label>
      <button id="langToggle" class="btn ghost" type="button" aria-label="Language">ES</button>
    </div>
  </header>
  <p id="msg" class="msg" role="status"></p>
  <p class="stand" data-t="stand"></p>
  <main class="wt-grid">
    <section class="col"><h2 data-t="bagtag">Bag/tag</h2><div id="bagtag"></div></section>
    <section class="col wide"><h2 data-t="cells">Cells</h2><div id="cells" class="cells"></div></section>
    <section class="col">
      <h2 data-t="spider">Water spider: pull list</h2><div id="spider"></div>
      <h2 data-t="feed">What just happened</h2><ul id="feed" class="feed"></ul>
    </section>
  </main>
