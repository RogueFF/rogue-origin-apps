<body>
  <header class="ro-head">
    <h1 data-t="title">Practice floor</h1>
    <button id="langToggle" class="btn ghost" aria-label="Language">ES</button>
  </header>
  <main class="ro-main">
    <p class="intro" data-t="intro"></p>
    <p id="msg" class="msg" role="status"></p>

    <section class="card">
      <h2 data-t="load">1. Load a day</h2>
      <div class="row">
        <label><span data-t="day">Day</span> <input id="day" type="date"></label>
        <label><span data-t="seed">Variation</span> <input id="seed" type="number" value="1" min="1" max="999"></label>
        <button id="genBtn" class="btn primary" type="button" data-t="generate">Make a day from the 90-day shape</button>
      </div>
      <div class="row">
        <label class="file"><span data-t="csv">Or replay a real day from a Shopify order export (CSV)</span> <input id="csv" type="file" accept=".csv,text/csv"></label>
        <button id="replayBtn" class="btn" type="button" data-t="replay" disabled>Replay that day</button>
      </div>
    </section>

    <section class="card">
      <h2 data-t="run">2. Run it</h2>
      <div class="row">
        <span class="clock-label" data-t="clock">Sim clock</span> <b id="clock" class="clock">--</b>
      </div>
      <div class="row speed" id="speed" data-v="10">
        <span data-t="speed">Speed</span>
        <button class="btn" type="button" data-v="1">1×</button>
        <button class="btn on" type="button" data-v="10">10×</button>
        <button class="btn" type="button" data-v="60">60×</button>
        <button id="pauseBtn" class="btn ghost" type="button" data-t="pause">Pause</button>
      </div>
      <label class="row"><input id="auto" type="checkbox" checked> <span data-t="auto">Auto bag/tag</span></label>
      <div id="counts" class="counts"></div>
    </section>

    <section class="card">
      <h2 data-t="screens">3. Open the screens</h2>
      <div class="links">
        <a class="btn" target="_blank" data-href="bagtag.html" data-t="bagtag">Bag/tag queue</a>
        <a class="btn" target="_blank" data-href="cells.html" data-t="board">Cells board</a>
        <a class="btn" target="_blank" data-href="pull.html" data-t="pull">Pull list</a>
        <a class="btn" target="_blank" data-href="cell.html?station=table1" data-cell="1">Cell 1 screen</a>
        <a class="btn" target="_blank" data-href="cell.html?station=table12" data-cell="12">Cell 12 screen</a>
      </div>
      <p class="hint" data-t="cellNote"></p>
    </section>
  </main>
</body>
