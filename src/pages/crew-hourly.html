<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Registro por hora de celdas - Rogue Origin</title>
  <!-- Retired 2026-11-18 (Koa: "I like the previous layout"): people are entered on the
       cell hourly log now. This page only forwards there, keeping ?date=. -->
  <script>
    (function () {
      var d = new URLSearchParams(location.search).get('date');
      location.replace('cell-hourly.html' + (d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? '?date=' + d : ''));
    })();
  </script>
</head>
<body>
  <p><a href="cell-hourly.html">Registro por hora de celdas / Cell hourly log</a></p>
</body>
</html>
