name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # `npm ci` installs exactly what package-lock.json pins, so a
        # dependency cannot drift under CI between runs.
        run: npm ci --no-audit --no-fund

      - name: Lint
        # eslint exits non-zero on errors only, so the ~115 remaining warnings
        # (unused vars, prefer-const) do not fail the build. Errors do.
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Asset hashes live in the HTML and are regenerated by a pre-commit hook.
      # Hooks are not version-controlled, so a clone without one installed will
      # happily commit pages whose ?h= no longer matches the files they name —
      # and stale hashes are exactly what this machinery exists to prevent.
      # This is the only check that catches that.
      - name: Verify asset hashes are current
        run: npm run stamp:check
