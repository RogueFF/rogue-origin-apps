name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # `npm ci` installs exactly what package-lock.json pins, so a
        # dependency cannot drift under CI between runs.
        run: npm ci --no-audit --no-fund

      # Several tests under tests/ drive a real browser (the practice tutorial,
      # and the intake flow). `npm ci` installs the Playwright PACKAGE but not
      # the browser binaries, so without this the suite fails with
      # "Executable doesn't exist at .../chromium_headless_shell-…" whenever the
      # runner's cache does not happen to hold the right build. That is why this
      # workflow has passed and failed on identical code.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        # eslint exits non-zero on errors only, so the ~115 remaining warnings
        # (unused vars, prefer-const) do not fail the build. Errors do.
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Asset hashes are the build's job now, not a pre-commit hook's. What CI
      # has to prove instead is that the build still serves every URL the site
      # serves today: the barn TV, the crew's bookmarks, the Worker's SMS links
      # and Twilio's messaging policy page all name paths in this repo.
      - name: Build
        run: npm run build

      - name: Check published URLs
        run: npm run check:urls
