name = "rogue-origin-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Production environment
[env.production]
name = "rogue-origin-api"

# Environment variables (set via wrangler secret put)
# Required secrets:
# - GOOGLE_SERVICE_ACCOUNT_EMAIL
# - GOOGLE_PRIVATE_KEY
# - PRODUCTION_SHEET_ID
# - ORDERS_SHEET_ID
# - BARCODE_SHEET_ID
# - KANBAN_SHEET_ID
# - SOP_SHEET_ID
# - ANTHROPIC_API_KEY
# - GOOGLE_TTS_API_KEY
# - ORDERS_PASSWORD
# - POOL_INVENTORY_API_URL (Pool Inventory Service base URL)
# - POOL_INVENTORY_API_KEY (Pool Inventory Service API key)
# - BREAKDOWN_API_KEY        (Bearer token for supersack tops_breakdown — per-cultivar yield IP; share with web team out-of-band)
# - JD_CLIENT_ID                 (John Deere developer app client ID)
# - JD_CLIENT_SECRET             (John Deere developer app client secret)
# - JD_REFRESH_TOKEN             (long-lived OAuth refresh token)
# - JD_ORG_ID                    (Rogue Family Farms Operations Center org ID)
# - JD_ENV                       ("sandbox" | "production"; flip when prod approved)
# - TELEGRAM_TEST_CHAT_ID        (Telegram TEST chat id for harvest-tracking scans —
#                                  same bot as TELEGRAM_BOT_TOKEN, separate test group.
#                                  See wiki/operations/plans/2026-07-06-seed-to-sale-harvest-tracking.md)
# - TWILIO_ACCOUNT_SID           (harvest hourly SMS bot — Twilio account SID)
# - TWILIO_AUTH_TOKEN            (Twilio auth token; also verifies inbound /sms/inbound
#                                  signatures. Unset = inbound is unauthenticated.)
# - TWILIO_FROM_NUMBER           (the toll-free sender, E.164 e.g. +18885551234.
#                                  Toll-free verification must be approved or carriers drop it.)
# - HARVEST_SMS_KEY              (harvest hourly SMS bot — the Capataz relay's bearer for
#                                  sms_poll / sms_send / hourly_set. NOT the farm password:
#                                  this key lives on the FERN bot host and on the
#                                  farm-bridge MCP worker. Same value in all three places.)
# - TELEGRAM_HARVEST_HOURLY_CHAT_ID  (OPTIONAL — missed-hour and Capataz-stale alerts;
#                                  falls back to TELEGRAM_TEST_CHAT_ID)
# - TWILIO_WEBHOOK_URL           (OPTIONAL var — only behind a custom domain or proxy.
#                                  Twilio signs the URL it was configured with; leave
#                                  unset on *.workers.dev or every signature fails.)
#                                  Runbook: docs/harvest-hourly-sms.md
#
# The hourly bot no longer calls a model: v2 queues chat texts for the Capataz
# relay, so there is no HARVEST_HOURLY_MODEL and ANTHROPIC_API_KEY above is for
# production/chat.js and sop-d1.js only.

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "rogue-origin-db"
database_id = "31397aa4-aa8c-47c4-965d-d51d36be8b13"

# R2 Storage (SOP media)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sop-media"

# CORS configuration
[vars]
# Harvest capture: "true" writes every scan as test data and skips Shopify.
#
# COMMITTED ON PURPOSE (2026-09-07). This used to be passed at deploy time with
# --var and lived nowhere else, while the code defaults to test mode for any
# value but "false". So a routine redeploy that forgot the flag silently turned
# a live harvest into test rows — which the season's own cleanup step,
# DELETE FROM harvest_scan_log WHERE is_test = 1, would then delete.
#
# Flip to "false" before the first real cut, commit that, and deploy. Every crew
# screen shows a red band while this is "true", so the state is visible on a
# phone rather than inferred from a dashboard.
HARVEST_TEST_MODE = "false"

ALLOWED_ORIGINS = "https://rogueff.github.io,https://rogueorigin.com,https://www.rogueorigin.com,http://localhost:3000,http://localhost:5500"

# Cron Triggers
[triggers]
crons = [
  "0 14 * * *",   # Daily 6 AM PT (14:00 UTC during PST) — complaints sync + harvest weight allocation
  "0 17 * * 5",   # Friday 9 AM PT (17:00 UTC during PST) — Friday cart Telegram reminder
  "0 14 * * 1",   # Monday 6 AM PT (14:00 UTC during PST) — supersack QA, silent when clean
  "*/5 * * * *",  # Every 5 min — JD Operations Center telemetry ingest (Field Ops Tracking system, Phase 1)
]
